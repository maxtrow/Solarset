<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SolarSet – Solar panel lifecycle and recycling rewards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f4f7f4;--card:#fff;--ink:#0f2a1f;--muted:#5b6e63;--line:#dde6df;--head:#0b4a34;--on-head:#fff;--btn:#0b4a34;--on-btn:#fff;--acc:#1c7c54;--y:#f2c230;--yd:#3b2c00;--warn:#c9760b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1712;--soft:#10201a;--card:#132a21;--ink:#e8f1ec;--muted:#97b0a3;--line:#24413a;--head:#0f2a20;--btn:#3fbf8a;--on-btn:#04180f;--acc:#3fbf8a;--warn:#f0a82e}}
:root[data-theme="dark"]{--bg:#0b1712;--soft:#10201a;--card:#132a21;--ink:#e8f1ec;--muted:#97b0a3;--line:#24413a;--head:#0f2a20;--btn:#3fbf8a;--on-btn:#04180f;--acc:#3fbf8a;--warn:#f0a82e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:84px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{background:var(--head);color:var(--on-head);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--y)}
header b{font-size:18px;font-weight:800;letter-spacing:.02em}
header button{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:5px 11px;font:inherit;font-size:12px;letter-spacing:.04em;cursor:pointer}
main{padding:22px 20px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin:0 0 4px}
h2{font-size:24px;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
h3{font-size:12px;margin:0 0 10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;background:var(--btn);color:var(--on-btn);border:0;border-radius:8px;padding:13px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none;letter-spacing:.01em}
.btn.y{background:var(--y);color:var(--yd)}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.scan{aspect-ratio:1;max-width:250px;margin:4px auto 20px;border-radius:10px;background:var(--soft);position:relative;overflow:hidden;border:1px solid var(--line)}
.scan::before,.scan::after{content:"";position:absolute;width:42px;height:42px;border:3px solid var(--acc);border-radius:4px}
.scan::before{top:20px;left:20px;border-right:0;border-bottom:0}.scan::after{bottom:20px;right:20px;border-left:0;border-top:0}
.scan .ln{position:absolute;left:14%;right:14%;height:2px;background:var(--y);box-shadow:0 0 12px var(--y);animation:sc 2.4s ease-in-out infinite alternate}
@keyframes sc{from{top:18%}to{top:80%}}
@media (prefers-reduced-motion:reduce){.scan .ln{animation:none;top:48%}}
.chips{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.chip small{color:var(--muted);display:block;font-size:13px}
.verdict{background:var(--soft);border-left:4px solid var(--acc);border-radius:6px;padding:14px 16px;margin-bottom:14px;font-size:15px}
.verdict small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.verdict b{display:block;font-size:20px;font-weight:800;margin:2px 0 4px}
.v-now{border-color:var(--warn)}.v-soon{border-color:var(--y)}
.bar{height:8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%}
.score{font-size:30px;font-weight:800;line-height:1}.score small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0;padding-bottom:0}.row:first-child{padding-top:0}.row span{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card)}
.stat b{font-size:26px;display:block;line-height:1.15;font-weight:800}.stat span{color:var(--muted);font-size:12px}
.feature{background:var(--head);color:#fff;border-radius:10px;padding:20px;margin-bottom:14px;border-left:4px solid var(--y)}
.feature small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8;display:block}
.feature strong{font-size:48px;font-weight:800;line-height:1.1;display:block;color:var(--y)}
.feature p{margin:2px 0 0;opacity:.92;font-size:14px}
.tier{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tier:last-child{border:0;padding-bottom:0}
.pct{min-width:56px;text-align:center;font-weight:800;border-radius:6px;padding:3px 0;background:var(--soft);border:1px solid var(--line)}
.tier.on .pct{background:var(--y);color:var(--yd);border-color:var(--y)}
.perk{padding:10px 0 10px 16px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.perk:last-child{border:0;padding-bottom:0}.perk:first-of-type{padding-top:0}
.perk::before{content:"";position:absolute;left:0;top:18px;width:7px;height:7px;background:var(--y)}
.perk:first-of-type::before{top:8px}
.perk span{color:var(--muted);font-size:14px}
.steps{list-style:none;margin:12px 0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:6px 0;color:var(--muted);font-size:14px}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.d{color:var(--ink);font-weight:700}.steps li.d::before{background:var(--acc);border-color:var(--acc)}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--y);color:var(--yd);border-radius:6px;padding:6px 11px;font-weight:700;display:inline-block;margin-top:10px;letter-spacing:.08em;font-size:14px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:10px 4px 9px;font:inherit;font-size:12px;font-weight:500;letter-spacing:.03em;color:var(--muted);cursor:pointer}
nav svg{display:block;margin:0 auto 3px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--y)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.empty .btn{margin-top:16px}
a:not(.btn){color:var(--acc);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.seg button{text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.seg button span{display:block;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--y);box-shadow:inset 0 0 0 2px var(--y)}
.slot{display:flex;align-items:center;gap:14px;border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:10px;cursor:pointer;background:var(--card);position:relative}
.slot.has{border-style:solid;border-color:var(--acc)}
.slot input{position:absolute;opacity:0;width:1px;height:1px}
.slot:focus-within{outline:3px solid var(--y);outline-offset:2px}
.slot img,.slot .plus{width:64px;height:64px;border-radius:6px;object-fit:cover;flex:none;background:var(--soft)}
.slot .plus{display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.slot small{display:block;color:var(--muted);font-size:13px}
.note{background:var(--soft);border-left:4px solid var(--y);padding:10px 14px;border-radius:6px;font-size:14px;margin:6px 0 16px}
.thumbs{display:flex;gap:8px;margin:10px 0 4px}.thumbs img{width:56px;height:56px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.hr{display:flex;align-items:center;gap:8px}.hr span{font-size:13px;opacity:.9}
.hr button[hidden]{display:none}
label.f{display:block;font-size:13px;font-weight:700;margin:0 0 5px}
.pwrow{position:relative}.pwrow input{padding-right:64px}
.tog{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--acc);font:inherit;font-weight:700;font-size:13px;padding:6px 8px;cursor:pointer}
.hint{color:var(--muted);font-size:13px;margin:-2px 0 10px}
.err{color:var(--warn);font-size:14px;font-weight:700;min-height:20px;margin:0 0 10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#splash{position:fixed;inset:0;z-index:100;background:var(--head);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .sun{width:72px;height:72px;color:var(--y);animation:spin 9s linear infinite}
.sp-name{font-size:40px;font-weight:800;letter-spacing:.01em;margin-top:6px}
.sp-tag{font-size:14px;opacity:.85;letter-spacing:.04em}
.sp-bar{width:160px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:18px}
.sp-bar i{display:block;height:100%;background:var(--y);border-radius:99px;animation:load 2s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes load{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){#splash .sun{animation:none}.sp-bar i{animation:none;width:100%}#splash{transition:none}}
.plate{background:#fff;border-radius:8px;padding:5px 10px;display:inline-flex}
.plate img{height:24px;width:auto;display:block}
.plate.big{padding:18px 26px;border-radius:12px;margin-bottom:6px}.plate.big img{height:44px}
@media (max-width:400px){.hr span{display:none}}
textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;margin-bottom:6px}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tg{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--y);color:var(--yd);border-color:var(--y);font-weight:700}
.desc{background:var(--soft);border-radius:8px;padding:10px 12px;margin:10px 0}
.desc small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.desc p{margin:6px 0 0;font-size:14px;white-space:pre-wrap}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:2px 9px;margin:6px 6px 0 0}
</style>
</head>

<script>
const PANELS=[
 {id:"SN-14-0412",model:"SN-300M",maker:"SolarNova Energy",rated:300,now:212,health:58,made:2014,expires:"2026-12-31",phone:"1800 555 014",email:"care@solarnova.example",hours:"Mon–Fri 8am–6pm",address:"48 Foundry Road, Dandenong VIC 3175",site:"https://www.solarnova.example",partners:[["EcoReclaim Pty Ltd","Glass and silicon recovery","Dandenong, VIC"],["Cellwise Recyclers","Metals and cabling","Geelong, VIC"]]},
 {id:"GR-19-1180",model:"GR-380P",maker:"GreenRay Solar",rated:380,now:351,health:92,made:2019,expires:"2044-06-30",phone:"1800 555 073",email:"help@greenray.example",hours:"Daily 7am–9pm",address:"112 Harbour Street, Newcastle NSW 2300",site:"https://www.greenray.example",partners:[["BrightLoop Recyclers","Full-panel recycling","Sydney, NSW"],["ReCell Labs","Cell repair and refurbishment","Newcastle, NSW"]]},
 {id:"SC-11-0077",model:"SC-250",maker:"SunCrest",rated:250,now:84,health:31,made:2011,expires:"2025-08-31",phone:"1800 555 090",email:"support@suncrest.example",hours:"Mon–Sat 9am–5pm",address:"7 Quarry Lane, Wangara WA 6065",site:"https://www.suncrest.example",partners:[["Southern Cell Recovery","Glass and silicon recovery","Perth, WA"]]}
];
const TIERS=[{n:1,p:10},{n:3,p:15},{n:5,p:20}];
const STAGES={
 recycle:["Photos submitted","Verified for transport","Courier pickup","Received by manufacturer","Transferred to partner recycler","Recycled and certified"],
 repair:["Photos submitted","Verified for transport","Courier pickup","Received by manufacturer","Repair in progress","Repaired and returned"]};
const SLOTS=[["Front face","Full panel with the glass surface visible"],["Rear label","Serial number and QR code"],["Damage or wear","Close-up of cracks, burns or discolouration"]];
const PERKS=[["Complimentary pickup","Collected from your address at no cost."],["Recycling certificate","Verified proof of responsible disposal."],["System health check","Technician assessment of the remaining array."],["Welcome gift","Included with your first completed return."]];
const ICON=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const NAV=[["scan",ICON('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/>'),"Scan"],["panel",ICON('<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 11v2M7 10v4M11 10v4"/>'),"Panel"],["rewards",ICON('<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1"/>'),"Rewards"]];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TAGS=["Cracked glass","Reduced output","Burn marks","Frame damage","Junction box fault","Other"];
const $=id=>document.getElementById(id);
const ACCOUNTS={"demo@solarset.example":{name:"Alex Demo",pw:"solarset123"}};
let user=null,mode="signin",loginErr="",lf={name:"",email:""};
let view="scan",panel=null,returned=0,reqs=[],code=null,draft={service:"recycle",photos:[null,null,null],desc:"",tags:[]};

const verdict=p=>{
  const m=(new Date(p.expires)-new Date())/(30.4*864e5);
  if(p.health<40||m<=0)return{k:"now",t:"Recycle now",d:m<=0?"This panel has passed its rated expiry date and output is declining.":"Health is critically low. Return it for certified recycling."};
  if(p.health<70||m<24)return{k:"soon",t:"Recycle soon",d:"Operating, but approaching end of life. Request a return to secure your loyalty rewards."};
  return{k:"keep",t:"Continue use",d:"Performance is within the normal range. Re-scan when health falls below 70%."};
};
const tier=n=>[...TIERS].reverse().find(t=>n>=t.n)||{n:0,p:0};
const hcol=h=>h>=70?"var(--acc)":h>=40?"var(--y)":"var(--warn)";
const fmt=d=>new Date(d).toLocaleDateString("en-AU",{month:"short",year:"numeric"});

function navbar(){$("nav").innerHTML=NAV.map(([k,i,l])=>`<button type="button" data-v="${k}" ${(view===k||(k==="panel"&&view==="request"))?'aria-current="page"':""}>${i}${l}</button>`).join("")}

function scanView(){return `
 <p class="eyebrow">Welcome, ${esc(user.name.split(" ")[0])}</p><h2>Scan your panel</h2><p class="sub">Align the QR code on the panel frame within the viewfinder to view its status.</p>
 <div class="scan" aria-hidden="true"><div class="ln"></div></div>
 <button class="btn" type="button" data-scan="0" style="margin-bottom:18px">Scan QR code (demo)</button>
 <div class="card"><h3>Enter panel ID</h3><input id="pid" placeholder="e.g. SN-14-0412" aria-label="Panel ID"><button class="btn o" type="button" data-manual="1">Look up panel</button><p class="sub" id="err" style="margin:8px 0 0;font-size:14px"></p></div>
 <h3>Sample panels</h3><div class="chips">${PANELS.map((p,i)=>`<button class="chip" type="button" data-scan="${i}"><span><b>${p.maker}</b><small>${p.model} · ${p.id}</small></span><span aria-hidden="true">›</span></button>`).join("")}</div>`}

function panelView(){
  if(!panel)return `<div class="empty">No panel scanned yet.<br><button class="btn" type="button" data-v="scan">Scan a panel</button></div>`;
  const p=panel,v=verdict(p),eff=Math.round(p.now/p.rated*100),t=tier(returned+1).p,act=reqs.some(r=>r.id===p.id);
  return `<p class="eyebrow">${p.id}</p><h2>${p.maker}</h2><p class="sub">Model ${p.model}</p>
 <div class="verdict v-${v.k}"><small>Recommendation</small><b>${v.t}</b>${v.d}</div>
 <div class="card"><h3>Panel health</h3><div class="score">${p.health}%<small>health score</small></div><div class="bar"><i style="width:${p.health}%;background:${hcol(p.health)}"></i></div></div>
 <div class="stats"><div class="stat"><b>${eff}%</b><span>Efficiency · ${p.now} W of ${p.rated} W</span></div><div class="stat"><b>${fmt(p.expires)}</b><span>Expiry date</span></div></div>
 <div class="card"><h3>Specification</h3><div class="row"><span>Model</span><b>${p.model}</b></div><div class="row"><span>Manufacturer</span><b>${p.maker}</b></div><div class="row"><span>Year manufactured</span><b>${p.made}</b></div></div>
 <div class="feature"><small>Recycling reward</small><strong>${t}% off</strong><p>on every future purchase from ${p.maker}</p></div>
 <button class="btn y" type="button" data-start="1" ${act?"disabled":""}>${act?"Request in progress":"Request recycling or repair"}</button>
 <div class="card" style="margin-top:14px"><h3>Manufacturer</h3>
 <div class="row"><span>Company</span><b>${p.maker}</b></div>
 <div class="row"><span>Address</span><b style="text-align:right">${p.address}</b></div>
 <div class="row"><span>Website</span><a href="${p.site}" target="_blank" rel="noopener noreferrer">${p.site.replace("https://","")} ↗</a></div></div>
 <div class="card"><h3>Recycling and repair partners</h3>${p.partners.map(([n,r,l])=>`<div class="perk"><b>${n}</b><br><span>${r} · ${l}</span></div>`).join("")}</div>
 <div class="card"><h3>Customer support</h3><p class="sub" style="margin-bottom:12px;font-size:14px">Available ${p.hours}.</p>
 <a class="btn" style="margin-bottom:8px" href="tel:${p.phone.replace(/\s/g,"")}">Call ${p.phone}</a><a class="btn o" href="mailto:${p.email}">${p.email}</a></div>`}

function requestView(){
  const p=panel,d=draft,n=d.photos.filter(Boolean).length;
  return `<p class="eyebrow">Request · ${p.id}</p><h2>Verify your panel</h2><p class="sub">${p.maker} reviews your photos to confirm the panel is safe to transport.</p>
 <h3>Service</h3><div class="seg">${[["recycle","Recycle","End of life, certified recycling"],["repair","Repair","Fixed and returned to you"]].map(([k,l,x])=>`<button type="button" data-svc="${k}" aria-pressed="${d.service===k}"><b>${l}</b><span>${x}</span></button>`).join("")}</div>
 <h3>Photos (${n} of 3)</h3>${SLOTS.map(([t,x],i)=>`<label class="slot ${d.photos[i]?"has":""}"><input type="file" accept="image/*" capture="environment" data-slot="${i}">${d.photos[i]?`<img src="${d.photos[i]}" alt="${t}">`:`<span class="plus">+</span>`}<span><b>${t}</b><small>${x}</small></span></label>`).join("")}
 <h3 style="margin-top:20px">Describe the problem</h3>
 <div class="chips2">${TAGS.map(t=>`<button type="button" class="tg" data-tag="${t}" aria-pressed="${d.tags.includes(t)}">${t}</button>`).join("")}</div>
 <label class="f" for="desc">What is wrong with this panel?</label>
 <textarea id="desc" maxlength="500" rows="4" placeholder="e.g. Output dropped last winter, a crack appeared after a storm, and the junction box feels hot.">${esc(d.desc)}</textarea>
 <p class="hint"><span id="cnt">${d.desc.length}</span>/500 · At least 10 characters</p>
 <div class="note">Wear gloves when handling cracked glass and keep the panel flat. Do not attempt to move a panel that is still connected to a live system.</div>
 <button class="btn y" type="button" id="sub" data-submit="1" ${(n<3||d.desc.trim().length<10)?"disabled":""}>Submit for verification</button>
 <button class="btn o" type="button" data-v="panel" style="margin-top:8px">Cancel</button>`}

function rewardsView(){
  const cur=tier(returned),next=TIERS.find(t=>t.n>returned);
  return `<p class="eyebrow">Loyalty programme</p><h2>Your rewards</h2><p class="sub">Each panel recycled earns a discount applied to every future purchase.</p>
 <div class="feature"><small>Current discount</small><strong>${cur.p}%</strong><p>${returned} panel${returned===1?"":"s"} recycled${next?` · ${next.n-returned} more to reach ${next.p}%`:" · highest tier reached"}</p>${code?`<span class="code">${code}</span>`:""}</div>
 ${reqs.length?`<h3>Request status</h3>`+reqs.map((r,i)=>`<div class="card"><b>${r.maker}</b> <span class="sub">${r.model} · ${r.svc==="repair"?"Repair":"Recycling"}</span>
  <div class="thumbs">${r.photos.map(x=>`<img src="${x}" alt="Submitted photo">`).join("")}</div>
  ${(r.tags.length||r.desc)?`<div class="desc"><small>Issue reported</small>${r.tags.length?`<div>${r.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>`:""}<p>${esc(r.desc)}</p></div>`:""}
  <ul class="steps">${STAGES[r.svc].map((s,j)=>`<li class="${j<=r.st?"d":""}">${s}</li>`).join("")}</ul>
  <p class="sub" style="font-size:14px;margin:0 0 10px">${r.ref?`Verified for transport · Reference <b>${r.ref}</b>`:`Awaiting photo review by ${r.maker}.`}</p>
  ${r.st<5?`<button class="btn o" type="button" data-adv="${i}">Simulate next update</button>`:`<b style="color:var(--acc)">${r.svc==="repair"?"Repair complete. Panel returned to you.":"Complete. Discount activated."}</b>`}</div>`).join(""):""}
 <div class="card"><h3>Discount tiers</h3>${TIERS.map(t=>`<div class="tier ${returned>=t.n?"on":""}"><span class="pct">${t.p}%</span><span>${t.n} panel${t.n>1?"s":""} recycled</span></div>`).join("")}</div>
 <div class="card"><h3>Included benefits</h3>${PERKS.map(([a,b])=>`<div class="perk"><b>${a}</b><br><span>${b}</span></div>`).join("")}</div>
 <div class="card"><h3>How it works</h3><p class="sub" style="margin:0;font-size:14px">You submit photos and the manufacturer verifies the panel for transport. They collect it and pass it to a partner recycler, and your discount activates once recycling is certified. Repairs do not count toward discount tiers.</p></div>`}

function loginView(){
  const su=mode==="signup";
  return `<p class="eyebrow">Welcome</p><h2>${su?"Create your account":"Sign in to SolarSet"}</h2>
 <p class="sub">Track your solar panels, contact your manufacturer and earn rewards for responsible recycling.</p>
 <div class="seg" role="group" aria-label="Account mode">
  <button type="button" data-mode="signin" aria-pressed="${!su}"><b>Sign in</b></button>
  <button type="button" data-mode="signup" aria-pressed="${su}"><b>Create account</b></button></div>
 <form id="auth" novalidate>
  ${su?`<label class="f" for="nm">Full name</label><input id="nm" name="name" autocomplete="name" value="${esc(lf.name)}">`:""}
  <label class="f" for="em">Email address</label><input id="em" name="email" type="email" autocomplete="email" inputmode="email" value="${esc(lf.email)}">
  <label class="f" for="pw">Password</label>
  <div class="pwrow"><input id="pw" name="pw" type="password" autocomplete="${su?"new-password":"current-password"}"><button type="button" class="tog" data-pw="1" aria-label="Show or hide password">Show</button></div>
  ${su?`<p class="hint">Use at least 8 characters.</p>`:""}
  <p class="err" role="alert">${loginErr}</p>
  <button class="btn" type="submit">${su?"Create account":"Sign in"}</button>
 </form>
 <div class="or"><span>or</span></div>
 <button class="btn o" type="button" data-demo="1">Continue with demo account</button>
 <p class="hint" style="margin-top:14px">Demo only: accounts exist for this session and nothing is stored. A production version would use secure server-side authentication.</p>`}

function render(keep){
  if(!user){$("view").innerHTML=loginView();$("nav").innerHTML="";$("out").hidden=true;$("who").textContent="";if(!keep)window.scrollTo(0,0);return}
  $("out").hidden=false;$("who").textContent=user.name.split(" ")[0];
  $("view").innerHTML=view==="scan"?scanView():view==="panel"?panelView():view==="request"?requestView():rewardsView();
  navbar();if(!keep)window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,a");if(!b)return;const d=b.dataset;
  if(d.mode){mode=d.mode;loginErr="";render(true)}
  else if(d.pw){const i=$("pw"),h=i.type==="password";i.type=h?"text":"password";b.textContent=h?"Hide":"Show"}
  else if(d.demo){user={name:"Alex Demo",email:"demo@solarset.example"};view="scan";render()}
  else if(d.v){view=d.v;render()}
  else if(d.scan!==undefined){panel=PANELS[+d.scan];view="panel";render()}
  else if(d.manual){const f=PANELS.find(p=>p.id.toLowerCase()===$("pid").value.trim().toLowerCase());if(f){panel=f;view="panel";render()}else $("err").textContent="No panel found with that ID. Try one of the samples below."}
  else if(d.start){draft={service:"recycle",photos:[null,null,null],desc:"",tags:[]};view="request";render()}
  else if(d.tag){const k=draft.tags.indexOf(d.tag);k<0?draft.tags.push(d.tag):draft.tags.splice(k,1);render(true)}
  else if(d.svc){draft.service=d.svc;render(true)}
  else if(d.submit){reqs.push({id:panel.id,maker:panel.maker,model:panel.model,svc:draft.service,photos:[...draft.photos],desc:draft.desc.trim(),tags:[...draft.tags],st:0,ref:null});view="rewards";render()}
  else if(d.adv!==undefined){const r=reqs[+d.adv];r.st++;if(r.st===1)r.ref="TR-"+(1000+Math.floor(Math.random()*9000));if(r.st===5&&r.svc==="recycle"){returned++;code="SSET-"+(1000+Math.floor(Math.random()*9000))}render(true)}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="auth")return;e.preventDefault();
  const f=new FormData(e.target),name=(f.get("name")||"").trim(),email=(f.get("email")||"").trim().toLowerCase(),pw=f.get("pw")||"";
  lf={name,email};loginErr="";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))loginErr="Enter a valid email address.";
  else if(mode==="signup"){
    if(!name)loginErr="Enter your full name.";
    else if(pw.length<8)loginErr="Password must be at least 8 characters.";
    else if(ACCOUNTS[email])loginErr="An account with this email already exists.";
    else{ACCOUNTS[email]={name,pw};user={name,email}}
  }else{
    const a=ACCOUNTS[email];
    if(!a||a.pw!==pw)loginErr="Incorrect email or password.";else user={name:a.name,email}
  }
  if(user){view="scan";lf={name:"",email:""}}
  render(!user);
});
$("out").onclick=()=>{user=null;mode="signin";view="scan";panel=null;reqs=[];returned=0;code=null;loginErr="";render()};
document.addEventListener("input",e=>{
  if(e.target.id!=="desc")return;draft.desc=e.target.value;$("cnt").textContent=draft.desc.length;
  $("sub").disabled=!(draft.photos.every(Boolean)&&draft.desc.trim().length>=10);
});
document.addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f||e.target.dataset.slot===undefined)return;const i=+e.target.dataset.slot;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);draft.photos[i]=c.toDataURL("image/jpeg",.7);render(true)};im.src=fr.result};
  fr.readAsDataURL(f);
});
$("theme").onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b1712";r.dataset.theme=dk?"light":"dark"};
render();
setTimeout(()=>{const sp=$("splash");sp.classList.add("out");setTimeout(()=>{sp.hidden=true},600)},2200);
</script>
</body>
</html>
